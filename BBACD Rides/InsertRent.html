<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insert Student</title>
</head>
<body>
    <h2>Enter Rent details and click "Insert"</h2>
    <form action="InsertRent.php" method="POST">
        <label for="student_id">Student ID</label><br>
        <input id="student_id" name="student_id" type="text" maxlength="9" minilength="9"><br><br>

        <label for="vehicle_id">Vehicle ID</label><br>
        <input id="vehicle_id" name="vehicle_id" type="text" maxlength="8" minilength="8"><br><br>

        <label for="date">Date</label><br>
        <input id="date" name="date" type="date"><br><br>
        
        <label for="time">Time</label><br>
        <input id="time" name="time" type="number" step="0.01"><br><br>

        <label for="amount_Due">Amount Due</label><br>
        <input id="amount_Due" name="amount_Due" type="number"><br><br>

        <div> Status <br>
            <input type="radio" id="Available" name="status" value="Available">
                <label for="Available">Available </label><br>
            <input type="radio" id="Unavailable" name="status" value="Unavailable">
                <label for="Unavailable">Unavailable</label>
        </div>

        <br><br>
        <input type="submit" value="Insert">
        
    </form>
</body>
</html>
